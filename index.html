<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f1f4" />
    <meta name="description" content="Replenish: a shopping list that remembers what you buy, defers what can wait, and estimates when the essentials are due again." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Replenish" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Replenish</title>
    <script>
      // Paint with the saved theme straight away, before the app loads, so there is no flash.
      try {
        var t = JSON.parse(localStorage.getItem('replenish:theme') || 'null');
        if (t && t.vars) {
          var r = document.documentElement;
          for (var k in t.vars) r.style.setProperty('--' + k, t.vars[k]);
          for (var a in t.attrs) r.setAttribute('data-' + a, t.attrs[a]);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
